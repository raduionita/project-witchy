name: witchy
description: "Witchy is a comprehensive health tracking application designed to help you understand and monitor your menstrual cycle, fertility window, pregnancy, and overall reproductive health. Witchy combines personalized insights with evidence-based medical guidance."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  font_awesome_flutter: ^10.7.0
  device_info_plus: ^10.1.2
  url_launcher: ^6.3.0
  fl_chart: ^0.69.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# App icon generation (Phase 10). Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#3B0066"
  adaptive_icon_foreground: "assets/images/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#E0D4EA"
  image: "assets/images/splash/splash_logo.png"
  color_dark: "#3B0066"
  image_dark: "assets/images/splash/splash_logo.png"
  android_12:
    color: "#E0D4EA"
    image: "assets/images/splash/splash_logo.png"
    color_dark: "#3B0066"
    image_dark: "assets/images/splash/splash_logo.png"
  web: true

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/content/
    - assets/images/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/cinzel_600.ttf
          weight: 600
        - asset: assets/fonts/cinzel_700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans_400.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans_500.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans_600.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans_700.ttf
          weight: 700
