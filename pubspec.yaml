name: witchy
description: "Witchy is a comprehensive health tracking application designed to help you understand and monitor your menstrual cycle, fertility window, pregnancy, and overall reproductive health. Witchy combines personalized insights with evidence-based medical guidance."

# none = do not publish to pub.dev
publish_to: 'none'

# version 1.0.0 and +1 build number
version: 1.0.0+1

environment:
  sdk: ^3.7.2

# dependencies specify other packages that your package needs in order to work
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  
  # State management
  provider: ^6.1.2
  
  # Local storage
  shared_preferences: ^2.3.2
  
  # Unique ID generation
  uuid: ^4.4.0
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  
  # Internationalization
  intl: ^0.19.0
  
  # URL launching
  url_launcher: ^6.3.0
  
  # Font Awesome Icons
  font_awesome_flutter: ^10.7.0
  
  # Device info
  device_info_plus: ^10.1.0
  
  # File paths
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # "flutter_lints" contains a set of recommended lints to encourage good coding practices.
  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:

  # ensures that the Material Icons font is included with your application
  uses-material-design: true
