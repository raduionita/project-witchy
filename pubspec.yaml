name: witchy
description: "Witchy is a comprehensive health tracking application designed to help you understand and monitor your menstrual cycle, fertility window, pregnancy, and overall reproductive health. Witchy combines personalized insights with evidence-based medical guidance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.0.16
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  webview_flutter: ^4.10.0
  flutter_native_splash: ^2.4.8
  http: ^1.2.2
  xml: ^6.5.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.10.1

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/svgs/
flutter_native_splash:
  color: "#3B0A5E"
  image: assets/images/cat-moon-gold-512.png
  fullscreen: true
  android_12:
    color: "#3B0A5E"
    image: assets/images/cat-moon-gold-512.png
    icon_background_color: "#3B0A5E"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon_1024.png
  adaptive_icon_background: "#3B0A5E"
  adaptive_icon_foreground: assets/images/cat-moon-gold-512.png
  web:
    generate: true
    image_path: assets/images/app_icon_1024.png
    background_color: "#3B0A5E"
